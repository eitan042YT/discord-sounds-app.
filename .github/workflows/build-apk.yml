name: Build APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          unzip WhatsAppDiscordSoundsApp_Source.zip -d extracted
          cd extracted/WhatsAppDiscordSoundsApp

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        run: |
          cd extracted/WhatsAppDiscordSoundsApp
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Discord-Sounds-APK
          path: extracted/WhatsAppDiscordSoundsApp/app/build/outputs/apk/debug/app-debug.apk
